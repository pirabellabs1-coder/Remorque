services:
  postgres:
    # PostGIS est indispensable dès le départ : la recherche par rayon est la
    # requête la plus fréquente du site public (section 08).
    image: postgis/postgis:17-3.5
    container_name: remorque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remorque
      POSTGRES_PASSWORD: remorque
      POSTGRES_DB: remorque
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remorque -d remorque"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Cache et file d'attente : rappels, libérations de caution, relances,
    # exports lourds (section 08).
    image: redis:7-alpine
    container_name: remorque-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
